name: ci

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gates:
    name: gates (layout / desensitized / thresholds / python-floor)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: "Sprint layout gate (methodology binding)"
        run: python tools/check_sprint_layout.py
      - name: "Desensitization gate (no host paths / usernames / local proxy)"
        run: python tools/check_desensitized.py
      - name: "Threshold literal gate (no bare thresholds in src/)"
        run: python tools/check_thresholds.py
      - name: "Python floor gate (AST: nothing above requires-python)"
        run: python tools/check_python_floor.py
      - name: "CI workflow gate (workflow YAML must stay in a parseable subset)"
        run: python tools/check_ci_workflow.py
      - name: "Gate self-check (mutation verification: every gate must go red)"
        run: python tools/verify_gates.py

  tests:
    name: tests (py${{ matrix.python }} on ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: "3.8"
          - os: ubuntu-latest
            python: "3.12"
          - os: windows-latest
            python: "3.12"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install package + test deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest
          python -m pip install -e .
      - name: Run tests
        run: python -m pytest -q
      - name: "Smoke (installed CLI: help + example run)"
        shell: bash
        run: |
          bpreflight --help > /dev/null
          bpreflight check --input examples/spec-ean13.json > /dev/null
      - name: Package data is importable from the installed tree
        run: |
          python -c "from bpreflight import paths, thresholds; print(paths.DATA_DIR); thresholds.load_book()"
      - name: Bundled GS1 dictionary + vectors are importable (M1)
        run: |
          python -c "from bpreflight.gs1 import dictionary; d = dictionary.load(); print(d.dict_version, len(d)); assert len(d) > 0"
          python -c "from bpreflight.gs1 import vectors; print(sorted(vectors.identifier_lengths()))"
      - name: Wheel contains the bundled data (package-data globs do not recurse)
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.12'
        run: |
          python -m pip install build
          python -m build --wheel --outdir /tmp/dist
          python - <<'PY'
          import glob, zipfile
          whl = glob.glob('/tmp/dist/*.whl')[0]
          names = set(zipfile.ZipFile(whl).namelist())
          required = {
              'bpreflight/data/vectors/gs1_vectors.json',
              'bpreflight/data/vectors/dict_manifest.json',
              'bpreflight/data/gs1-syntax-dictionary/gs1-syntax-dictionary.txt',
              'bpreflight/data/gs1-syntax-dictionary/LICENSE',
              'bpreflight/data/gs1-syntax-dictionary/NOTICE',
          }
          missing = sorted(required - names)
          assert not missing, missing
          print('wheel ok:', len(names), 'files')
          PY
